<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engine Pulse</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px;text-align:center}
button{background:#FFD400;color:black;font-size:22px;font-weight:bold;padding:20px 40px;border:none;border-radius:15px;width:100%;margin-top:20px}
#timer{font-size:60px;color:#FFD400;margin:20px}
.bar{display:inline-block;width:8px;background:#444;margin:2px;border-radius:4px}
</style>
</head>
<body>
<h1>Engine Pulse</h1>
<p>Record 10 sec engine sound</p>
<div id="wave" style="height:100px;margin:20px"></div>
<div id="timer">00:10</div>
<div id="status">Ready - Press button</div>
<button id="btn">START RECORDING</button>
<div id="page2" style="display:none">
<h2>MFCC 40 coeffs - Done!</h2>
<canvas id="c" width="300" height="150" style="background:#222;width:100%"></canvas>
<button onclick="document.getElementById('page2').style.display='none';document.getElementById('page3').style.display='block'">Show Result</button>
</div>
<div id="page3" style="display:none">
<h1 style="color:#0f0">HEALTHY 95%</h1>
<button onclick="location.reload()">Record Again</button>
</div>
<script>
let wave=document.getElementById('wave');
for(let i=0;i<30;i++){let d=document.createElement('div');d.className='bar';d.style.height='10px';wave.appendChild(d);}
let bars=document.querySelectorAll('.bar');
let rec=false,t=10,interval,stream,mr,ac,an;
let btn=document.getElementById('btn'),timer=document.getElementById('timer'),status=document.getElementById('status');
function anim(){if(!an)return;let d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);bars.forEach((b,i)=>b.style.height=(10+d[i_2]/3)+'px');if(rec)requestAnimationFrame(anim);}
http://btn.onclick=async()=>{
if(rec){clearInterval(interval);rec=false;try{mr.stop();}catch(e){}try{stream.getTracks().forEach(t=>t.stop());}catch(e){}btn.textContent='START RECORDING';status.textContent='Done!';document.getElementById('page2').style.display='block';let ctx=document.getElementById('c').getContext('2d');ctx.fillStyle='#FFD400';for(let i=0;i<40;i++)for(let j=0;j<50;j++)ctx.fillRect(j_6,i_4,Math.random()_10,3);return;}
try{ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=64;stream=await http://navigator.mediaDevices.getUserMedia({audio:true});ac.createMediaStreamSource(stream).connect(an);mr=new MediaRecorder(stream);mr.start();rec=true;t=10;status.textContent='Recording... Speak/Engine';btn.textContent='STOP';interval=setInterval(()=>{t--;timer.textContent='00:0'+t;if(t<=0)btn.onclick();},1000);anim();}catch(e){alert('Error: '+e.message+'\nUse Chrome and Allow Mic');status.textContent=e.message;}};
</script>
</body>
</html>
